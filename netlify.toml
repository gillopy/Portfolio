[build]
  command = "npm run build"
  publish = "dist"

# Astro already emits dist/404.html; Netlify serves it automatically for 404s — no catch-all redirect.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
