schema: spec-driven

context: |
  Tech stack: Astro 7.2.9 + @astrojs/mdx 7.0.8 + Tailwind 4.3.3 (@tailwindcss/vite) + GSAP 3.15 + TypeScript 6.0 (strict via astro/tsconfigs/strict) + sharp 0.35 + Bun
  Architecture: Astro SSG (content-driven), file-based routing (src/pages), layouts (src/layouts), components (src/components/*.astro), content collections (src/content.config.ts + src/content/projects/**/*.mdx), static assets (public/), styles (src/styles)
  Testing: none (no test runner, no test scripts, no coverage)
  Style: Astro best-practices, Bun as package manager, MDX for project content, GSAP ScrollTrigger for animations
  Workspace: single project at . (portfolio), authoritative root C:\Users\solox\OneDrive\Escritorio\portfolio

projects:
  - path: "."
    stack: "Astro 7.2.9 / TypeScript / Tailwind 4 / GSAP"
    test_command: ""
    test_framework: ""
    coverage_command: ""
    linter_command: ""
    typecheck_command: "astro check"
    formatter_command: ""
    notes: "No test framework installed; only astro check/build available"

strict_tdd: false

testing:
  mode: "no-runner"
  reason: "No test runner detected in the single in-scope project; no explicit workspace-level test command covers every project. Strict TDD disabled per decision gate fallback."
  projects:
    - path: "."
      stack: "Astro 7.2.9 / TypeScript / Tailwind 4 / GSAP"
      test_command: "—"
      framework: "—"
  layers:
    - path: "."
      layer: "unit"
      available: false
      tool: "—"
    - path: "."
      layer: "integration"
      available: false
      tool: "—"
    - path: "."
      layer: "e2e"
      available: false
      tool: "—"
  coverage:
    - path: "."
      available: false
      command: "—"
  quality:
    - path: "."
      tool: "linter"
      available: false
      command: "—"
    - path: "."
      tool: "type checker"
      available: true
      command: "astro check"
    - path: "."
      tool: "formatter"
      available: false
      command: "—"

rules:
  proposal:
    - Include rollback plan for risky changes
    - Keep proposal under 300 lines; keep context concise
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - One requirement = one testable behavior
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale and tradeoffs
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session (< 30 min each)
  apply:
    guidelines:
      - Follow existing Astro component patterns (src/components/*.astro)
      - Follow content collection schema (src/content.config.ts)
      - Use Tailwind 4 utility classes; keep GSAP usage isolated
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "astro build"
    coverage_threshold: 0
    extra_checks:
      - "astro check"
  archive:
    - Warn before merging destructive deltas
    - Never delete archived changes; archive is audit trail
